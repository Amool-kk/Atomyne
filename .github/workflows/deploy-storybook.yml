name: Build & Deploy Storybook

on:
  push:
    branches:
      - main  # deploy happens after PR merge
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: storybook
  cancel-in-progress: true

jobs:
  # -----------------------------
  # 1️⃣ Build Job
  # -----------------------------
  build:
    runs-on: ubuntu-latest
    outputs:
      storybook-path: ${{ steps.build.outputs.storybook-path }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build UI core
        run: pnpm --filter @atomyne/ui-core build

      - name: Build UI react
        run: pnpm --filter @atomyne/ui-react build

      - name: Build Storybook
        id: build
        run: |
          pnpm --filter @atomyne/ui build-storybook
          echo "storybook-path=packages/docs/storybook-static" >> $GITHUB_OUTPUT

  # -----------------------------
  # 2️⃣ Deploy Job
  # -----------------------------
  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' # run only on main branch
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy Storybook to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ${{ needs.build.outputs.storybook-path }}
          publish_branch: gh-pages
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
          destination_dir: Atomyne